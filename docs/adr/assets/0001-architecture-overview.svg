  <text class="chip-sub" x="1257" y="860">measurement tools</text>

  <rect class="chip" x="1362" y="812" width="182" height="69" rx="8"/>
  <text class="chip-title" x="1453" y="842">RecordingPlugin</text>
  <text class="chip-sub" x="1453" y="860">record &amp; playback</text>

  <rect class="chip" x="1166" y="895" width="182" height="69" rx="8"/>
  <text class="chip-title" x="1257" y="925">BookmarksPlugin</text>
  <text class="chip-sub" x="1257" y="943">saved map locations</text>

  <rect class="chip" x="1362" y="895" width="182" height="69" rx="8"/>
  <text class="chip-title" x="1453" y="925">ExportPlugin</text>
  <text class="chip-sub" x="1453" y="943">data export</text>

  <!-- ============ Cluster 6: UI Shell (egui) ============ -->
  <g filter="url(#softShadow)"><rect class="cluster-box" x="560" y="1020" width="580" height="200" rx="14" stroke="#b4befe"/></g>
  <rect x="568" y="1030" width="6" height="180" rx="3" fill="#b4befe"/>
  <text class="cluster-title" x="586" y="1052" fill="#b4befe">UI Shell (egui)</text>

  <rect class="chip" x="576" y="1072" width="129" height="37" rx="7"/><text class="chip-title-sm" x="640.5" y="1095">dock</text>
  <rect class="chip" x="715" y="1072" width="129" height="37" rx="7"/><text class="chip-title-sm" x="779.5" y="1095">toolbar</text>
  <rect class="chip" x="854" y="1072" width="129" height="37" rx="7"/><text class="chip-title-sm" x="918.5" y="1095">statusbar</text>
  <rect class="chip" x="993" y="1072" width="129" height="37" rx="7"/><text class="chip-title-sm" x="1057.5" y="1095">theme</text>

  <rect class="chip" x="576" y="1119" width="129" height="37" rx="7"/><text class="chip-title-sm" x="640.5" y="1142">widgets</text>
  <rect class="chip" x="715" y="1119" width="129" height="37" rx="7"/><text class="chip-title-sm" x="779.5" y="1142">tools_window</text>
  <rect class="chip" x="854" y="1119" width="129" height="37" rx="7"/><text class="chip-title-sm" x="918.5" y="1142">ui_panels</text>
  <rect class="chip" x="993" y="1119" width="129" height="37" rx="7"/><text class="chip-title-sm" x="1057.5" y="1142">keyboard</text>

  <rect class="chip" x="576" y="1166" width="129" height="37" rx="7"/><text class="chip-title-sm" x="640.5" y="1189">inspector</text>
  <rect class="chip" x="715" y="1166" width="129" height="37" rx="7"/><text class="chip-title-sm" x="779.5" y="1189">debug_panel</text>
  <rect class="chip" x="854" y="1166" width="129" height="37" rx="7"/><text class="chip-title-sm" x="918.5" y="1189">hud</text>
  <rect class="chip" x="993" y="1166" width="129" height="37" rx="7"/><text class="chip-title-sm" x="1057.5" y="1189">debug_3d_hud</text>

  <!-- ============ Cluster 7: Support / Infra ============ -->
  <g filter="url(#softShadow)"><rect class="cluster-box" x="60" y="900" width="320" height="180" rx="14" stroke="#9399b2"/></g>
  <rect x="68" y="910" width="6" height="160" rx="3" fill="#9399b2"/>
  <text class="cluster-title" x="86" y="932" fill="#9399b2">Support / Infra</text>

  <rect class="chip" x="76" y="952" width="137" height="49" rx="7"/>
  <text class="chip-title-sm" x="144.5" y="980">ConfigPlugin</text>

  <rect class="chip" x="227" y="952" width="137" height="49" rx="7"/>
