  <rect class="chip-dashed" x="227" y="1015" width="137" height="49" rx="7" stroke="#9399b2"/>
  <text class="chip-title-sm" x="295.5" y="1043">brp *</text>

  <!-- ============ Legend ============ -->
  <text class="legend-title" x="100" y="1250">LEGEND</text>

  <line x1="100" y1="1275" x2="140" y2="1275" stroke="#cdd6f4" stroke-width="2.5" stroke-linecap="round"/>
  <text class="legend-text" x="150" y="1279">Plugin registered into the Bevy App / ECS</text>

  <line x1="100" y1="1298" x2="140" y2="1298" stroke="#f38ba8" stroke-width="2.5" stroke-dasharray="7,4" stroke-linecap="round"/>
  <text class="legend-text" x="150" y="1302">Depends on an external workspace crate</text>

  <text class="footer-text" x="950" y="1313">Scope: airjedi_bevy desktop app (src/). Companion crates shown as dependencies; airjedi-web (browser client) is a separate workspace member, out of scope here.</text>
  <text class="footer-text" x="950" y="1300" font-style="italic">* brp = optional Bevy Remote Protocol feature (default-on)</text>
</svg>
