  <text class="chip-title" x="144.5" y="600">CameraPlugin</text>
  <text class="chip-sub" x="144.5" y="618">3-camera rig</text>

  <rect class="chip" x="227" y="552" width="137" height="109" rx="8"/>
  <text class="chip-title" x="295.5" y="600">View3DPlugin</text>
  <text class="chip-sub" x="295.5" y="618">2D/3D transitions</text>

  <rect class="chip" x="76" y="675" width="137" height="109" rx="8"/>
  <text class="chip-title" x="144.5" y="723">InputPlugin</text>
  <text class="chip-sub" x="144.5" y="741">pan &amp; zoom</text>

  <rect class="chip" x="227" y="675" width="137" height="109" rx="8"/>
  <text class="chip-title" x="295.5" y="723">render_layers</text>
  <text class="chip-sub" x="295.5" y="741">layer defs</text>

  <!-- ============ Cluster 2: Map & Tiles ============ -->
  <g filter="url(#softShadow)"><rect class="cluster-box" x="630" y="140" width="440" height="240" rx="14" stroke="#a6e3a1"/></g>
  <rect x="638" y="150" width="6" height="220" rx="3" fill="#a6e3a1"/>
  <text class="cluster-title" x="656" y="172" fill="#a6e3a1">Map &amp; Tiles</text>

  <rect class="chip" x="646" y="192" width="126" height="79" rx="8"/>
  <text class="chip-title" x="709" y="228">TilesPlugin</text>
  <text class="chip-sub" x="709" y="246">render/pool</text>

  <rect class="chip" x="786" y="192" width="126" height="79" rx="8"/>
  <text class="chip-title" x="849" y="228">ZoomPlugin</text>
