  <g filter="url(#softShadow)"><rect class="cluster-box" x="1150" y="140" width="410" height="280" rx="14" stroke="#fab387" stroke-width="3"/></g>
  <rect x="1158" y="150" width="7" height="260" rx="3" fill="#fab387"/>
