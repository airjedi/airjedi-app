  <text class="chip-sub" x="1257" y="236">trails, picking, staleness</text>

  <rect class="chip" x="1362" y="192" width="182" height="62" rx="8"/>
  <text class="chip-title" x="1453" y="218">AdsbPlugin</text>
  <text class="chip-sub" x="1453" y="236">live ADS-B feeds</text>

  <rect class="chip" x="1166" y="266" width="182" height="62" rx="8"/>
  <text class="chip-title" x="1257" y="292">FusionIntegration</text>
  <text class="chip-sub" x="1257" y="310">EKF/UKF track fusion</text>

  <rect class="chip" x="1362" y="266" width="182" height="62" rx="8"/>
  <text class="chip-title" x="1453" y="292">DataIngestPlugin</text>
  <text class="chip-sub" x="1453" y="310">provider pipeline</text>

  <rect class="chip" x="1166" y="340" width="378" height="62" rx="8"/>
  <text class="chip-title" x="1355" y="366">DataSourcesPlugin</text>
  <text class="chip-sub" x="1355" y="384">feed configuration UI</text>

  <!-- ============ External workspace crates ============ -->
  <text class="section-label" x="1730" y="128" text-anchor="middle">EXTERNAL CRATES</text>

  <rect class="dep-box" x="1600" y="150" width="260" height="90" rx="10"/>
  <text class="dep-title" x="1730" y="182">adsb-client</text>
  <text class="dep-sub" x="1730" y="200">crate &#183; SBS-1 + BEAST</text>
  <text class="dep-sub" x="1730" y="216">protocol decode &amp; tracker</text>

  <rect class="dep-box" x="1600" y="260" width="260" height="90" rx="10"/>
  <text class="dep-title" x="1730" y="292">airjedi-fusion</text>
  <text class="dep-sub" x="1730" y="310">crate &#183; EKF / UKF / IMM</text>
  <text class="dep-sub" x="1730" y="326">filters &amp; track association</text>

  <!-- ============ Cluster 4: Aviation Reference Data ============ -->
  <g filter="url(#softShadow)"><rect class="cluster-box" x="1150" y="460" width="410" height="220" rx="14" stroke="#f9e2af"/></g>
  <rect x="1158" y="470" width="6" height="200" rx="3" fill="#f9e2af"/>
  <text class="cluster-title" x="1178" y="492" fill="#f9e2af">Aviation Reference Data</text>

  <rect class="chip" x="1166" y="512" width="182" height="69" rx="8"/>
  <text class="chip-title" x="1257" y="542">AviationPlugin</text>
  <text class="chip-sub" x="1257" y="560">airports, navaids, runways</text>

  <rect class="chip" x="1362" y="512" width="182" height="69" rx="8"/>
  <text class="chip-title" x="1453" y="542">AirspacePlugin</text>
  <text class="chip-sub" x="1453" y="560">airspace boundaries</text>

  <rect class="chip" x="1166" y="595" width="182" height="69" rx="8"/>
  <text class="chip-title" x="1257" y="625">WeatherPlugin</text>
  <text class="chip-sub" x="1257" y="643">METAR fetch</text>

  <rect class="chip" x="1362" y="595" width="182" height="69" rx="8"/>
  <text class="chip-title" x="1453" y="625">CoveragePlugin</text>
  <text class="chip-sub" x="1453" y="643">ADS-B coverage viz</text>

