<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1900 1330" width="1900" height="1330" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <radialGradient id="hubGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#cba6f7" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#cba6f7" stop-opacity="0"/>
    </radialGradient>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <filter id="hubGlowShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="0" stdDeviation="10" flood-color="#cba6f7" flood-opacity="0.55"/>
    </filter>
    <style>
      .title-main{font-weight:700;font-size:34px;fill:#cdd6f4}
      .title-sub{font-weight:400;font-size:16px;fill:#a6adc8}
      .section-label{font-weight:700;font-size:12.5px;fill:#7f849c;letter-spacing:2px}
      .hub-box{fill:#45475a;stroke:#cba6f7;stroke-width:3}
      .hub-title{font-weight:700;font-size:22px;fill:#f5e9ff;text-anchor:middle}
      .hub-text{font-weight:400;font-size:13px;fill:#dce0f5;text-anchor:middle}
      .hub-kicker{font-weight:700;font-size:11px;fill:#cba6f7;letter-spacing:2px;text-anchor:middle}
      .cluster-box{fill:#313244;stroke-width:2}
      .cluster-title{font-weight:700;font-size:16.5px}
      .chip{fill:#24243a;stroke:#3b3b52;stroke-width:1}
      .chip-dashed{fill:#24243a;stroke-width:1.5;stroke-dasharray:5,3}
      .chip-title{font-weight:700;font-size:12px;fill:#e6e9f7;text-anchor:middle}
      .chip-title-sm{font-weight:700;font-size:11px;fill:#e6e9f7;text-anchor:middle}
      .chip-sub{font-weight:400;font-size:10.5px;fill:#9399b2;text-anchor:middle}
      .dep-box{fill:#2d1f26;stroke:#f38ba8;stroke-width:2;stroke-dasharray:7,4}
      .dep-title{font-weight:700;font-size:15px;fill:#f5c2e7;text-anchor:middle}
      .dep-sub{font-weight:400;font-size:10.5px;fill:#dbb3c4;text-anchor:middle}
      .legend-text{font-weight:400;font-size:12.5px;fill:#a6adc8}
      .legend-title{font-weight:700;font-size:13px;fill:#7f849c;letter-spacing:2px}
      .footer-text{font-weight:400;font-size:11.5px;fill:#7f849c;text-anchor:middle}
    </style>
  </defs>

  <!-- ============ Background ============ -->
  <rect class="bg" x="0" y="0" width="1900" height="1330" fill="#1e1e2e"/>

  <!-- Core glow behind the hub, to reinforce ECS-as-center -->
  <circle cx="850" cy="650" r="300" fill="url(#hubGlow)"/>

  <!-- ============ Title ============ -->
  <text class="title-main" x="950" y="55" text-anchor="middle">AirJedi &#8212; Desktop App Architecture</text>
  <text class="title-sub" x="950" y="85" text-anchor="middle">ECS-centric component overview &#183; Bevy 0.19 &#183; airjedi_bevy (src/)</text>

  <!-- ============ Connecting lines (hub &lt;-&gt; clusters) ============ -->
  <g stroke-linecap="round" fill="none" opacity="0.9">
    <line x1="630" y1="650" x2="380" y2="650" stroke="#89b4fa" stroke-width="2.5"/>           <!-- Hub -> Rendering & Camera -->
    <line x1="850" y1="540" x2="850" y2="380" stroke="#a6e3a1" stroke-width="2.5"/>           <!-- Hub -> Map & Tiles -->
    <line x1="1070" y1="580" x2="1150" y2="280" stroke="#fab387" stroke-width="3"/>           <!-- Hub -> Aircraft & Live Tracking -->
    <line x1="1070" y1="650" x2="1150" y2="570" stroke="#f9e2af" stroke-width="2.5"/>         <!-- Hub -> Aviation Reference Data -->
    <line x1="1070" y1="700" x2="1150" y2="870" stroke="#94e2d5" stroke-width="2.5"/>         <!-- Hub -> Tools & Session -->
    <line x1="850" y1="760" x2="850" y2="1020" stroke="#b4befe" stroke-width="2.5"/>          <!-- Hub -> UI Shell -->
    <line x1="630" y1="700" x2="380" y2="990" stroke="#9399b2" stroke-width="2.5"/>           <!-- Hub -> Support / Infra -->
  </g>

  <!-- External-crate dependency lines (dashed, from Aircraft & Tracking only) -->
  <g stroke="#f38ba8" stroke-width="2.5" stroke-dasharray="7,4" stroke-linecap="round">
    <line x1="1560" y1="195" x2="1600" y2="195"/>  <!-- -> adsb-client -->
    <line x1="1560" y1="305" x2="1600" y2="305"/>  <!-- -> airjedi-fusion -->
  </g>

  <!-- Endpoint dots -->
  <g>
    <circle cx="630" cy="650" r="4" fill="#89b4fa"/><circle cx="380" cy="650" r="4" fill="#89b4fa"/>
    <circle cx="850" cy="540" r="4" fill="#a6e3a1"/><circle cx="850" cy="380" r="4" fill="#a6e3a1"/>
    <circle cx="1070" cy="580" r="4" fill="#fab387"/><circle cx="1150" cy="280" r="4" fill="#fab387"/>
    <circle cx="1070" cy="650" r="4" fill="#f9e2af"/><circle cx="1150" cy="570" r="4" fill="#f9e2af"/>
    <circle cx="1070" cy="700" r="4" fill="#94e2d5"/><circle cx="1150" cy="870" r="4" fill="#94e2d5"/>
    <circle cx="850" cy="760" r="4" fill="#b4befe"/><circle cx="850" cy="1020" r="4" fill="#b4befe"/>
    <circle cx="630" cy="700" r="4" fill="#9399b2"/><circle cx="380" cy="990" r="4" fill="#9399b2"/>
    <circle cx="1560" cy="195" r="3.5" fill="#f38ba8"/><circle cx="1600" cy="195" r="3.5" fill="#f38ba8"/>
    <circle cx="1560" cy="305" r="3.5" fill="#f38ba8"/><circle cx="1600" cy="305" r="3.5" fill="#f38ba8"/>
  </g>

  <!-- ============ HUB: Bevy App / ECS World ============ -->
  <g filter="url(#hubGlowShadow)">
    <rect class="hub-box" x="630" y="540" width="440" height="220" rx="20"/>
  </g>
  <text class="hub-kicker" x="850" y="568">ECS CORE</text>
  <text class="hub-title" x="850" y="596">Bevy App / ECS World</text>
  <text class="hub-text" x="850" y="622">Schedules: Startup &#8594; Update &#8594; EguiPrimaryContextPass</text>
  <text class="hub-text" x="850" y="642">Resources: MapState, ZoomState, AppConfig,</text>
  <text class="hub-text" x="850" y="660">LocalOrigin, Tile*Settings</text>
  <text class="hub-text" x="850" y="682">System ordering: ZoomSet::Change</text>

  <!-- ============ Cluster 1: Rendering & Camera ============ -->
