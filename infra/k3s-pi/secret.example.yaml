# Template only — copy to secret.yaml, fill in real values, and apply
# directly on the Pi (kubectl apply -f secret.yaml). Do NOT commit the
# filled-in secret.yaml; it's gitignored.
apiVersion: v1
kind: Secret
metadata:
  name: feeder-secrets
  namespace: feeders
type: Opaque
stringData:
  # Station UUID for adsb.lol (register at https://adsb.lol if you don't
  # have one yet). Also used as the generic ULTRAFEEDER UUID.
  UUID: "REPLACE_ME"

  # Friendly alphanumeric-only name shown on MLAT network status pages.
  MLAT_USER: "REPLACE_ME"

  # Full ULTRAFEEDER_CONFIG value. Starts with adsb.lol ADS-B + MLAT feed;
  # add more "adsb,host,port,proto;mlat,host,port,uuid=...;" segments here
  # to feed additional networks (airplanes.live, adsb.fi, ADSBX, etc.)
  # without touching the Deployment.
  ULTRAFEEDER_CONFIG: "adsb,in.adsb.lol,30004,beast_reduce_plus_out,uuid=REPLACE_ME;mlat,in.adsb.lol,31090,uuid=REPLACE_ME"

  # AirNav RadarBox sharing key, from your RadarBox account dashboard.
  RADARBOX_SHARING_KEY: "REPLACE_ME"
