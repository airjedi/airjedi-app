# Non-secret configuration for the readsb/ultrafeeder + airnavradar deployments.
# Values here mirror the current /etc/default/readsb on <PI_HOST>,
# so behavior should be identical to the systemd service once cut over.
apiVersion: v1
kind: ConfigMap
metadata:
  name: feeder-config
  namespace: feeders
data:
  # Receiver location. LAT/LONG taken from this repo's config.toml
  # receiver_location for the Beast feed (37.7139, -97.1364). ALT is a
  # placeholder in meters MSL — replace with a real surveyed value (including
  # antenna height) before relying on MLAT accuracy, since TDOA math is
  # sensitive to receiver position error.
  # NOTE: READSB_ALT wants a unit suffix, so this value must include "m"
  # (e.g. "426m"), not just a bare number.
  FEEDER_LAT: "37.7139"
  FEEDER_LONG: "-97.1364"
  FEEDER_ALT: "421.24m"
  FEEDER_TZ: "America/Chicago"

  # Only these two are confirmed real env vars for this image (checked
  # against its actual docker-compose.yml/README directly).
  READSB_DEVICE_TYPE: "rtlsdr"
  READSB_RTLSDR_PPM: "0"

  # Everything else from the current systemd flags is passed verbatim via
  # READSB_EXTRA_ARGS (confirmed real: "just passes arguments to the
  # commandline" per the image's README) rather than translated into named
  # env vars whose existence/defaults weren't independently verified
  # (e.g. gain "-10" vs "auto" are NOT necessarily equivalent in this
  # readsb fork, and the net-*-port defaults were never confirmed to match).
  # This is a straight copy of /etc/default/readsb's current flags, minus
  # --device-type/--ppm which are handled above:
  READSB_EXTRA_ARGS: "--device 0 --gain -10 --max-range 450 --write-json-every 1 --net --net-heartbeat 60 --net-ro-size 1250 --net-ro-interval 0.05 --net-ri-port 30001 --net-ro-port 30002 --net-sbs-port 30003 --net-bi-port 30004,30104 --net-bo-port 30005 --json-location-accuracy 2 --range-outline-hours 24"
