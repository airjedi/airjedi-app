[Journal]
# Keep host, k3s, kernel, and service logs across reboots.
Storage=persistent
Compress=yes

# Retain enough history to diagnose a few recent incidents without allowing
# logs to consume the device's disk indefinitely.
SystemMaxUse=256M
SystemKeepFree=1G
SystemMaxFileSize=32M
SystemMaxFiles=8
MaxRetentionSec=14day

# Flush crash-relevant messages promptly while retaining normal rate limits.
SyncIntervalSec=5s
RateLimitIntervalSec=30s
RateLimitBurst=10000
